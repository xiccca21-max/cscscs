services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Один источник пароля: .env (docker compose подставляет ${...} из файла .env в каталоге проекта)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: cs_ne_go
    # Только localhost на хосте — не 0.0.0.0:5432 (иначе боты и readme_to_recover).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/cs_ne_go?schema=public"
      DIRECT_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/cs_ne_go?schema=public"
      SESSION_SECRET: "${SESSION_SECRET}"
      STEAM_API_KEY: "${STEAM_API_KEY}"
      STEAMAPIS_KEY: "${STEAMAPIS_KEY}"
      TM_MARKET_API_KEY_CS2: "${TM_MARKET_API_KEY_CS2:-}"
      TM_MARKET_API_KEY_DOTA2: "${TM_MARKET_API_KEY_DOTA2:-}"
      TM_MARKET_API_KEY_TF2: "${TM_MARKET_API_KEY_TF2:-}"
      TM_MARKET_API_KEY_RUST: "${TM_MARKET_API_KEY_RUST:-}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      NEXT_PUBLIC_META_PIXEL_ID: "${NEXT_PUBLIC_META_PIXEL_ID:-}"
      ADMIN_STEAM_IDS: "${ADMIN_STEAM_IDS}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
